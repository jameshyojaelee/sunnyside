<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sunnyside, Queens</title>
    <meta name="description" content="Our corner of Sunnyside, Queens, drawn like a Sims neighborhood. Click a building to read about a place we love." />
    <meta name="theme-color" content="#1a2b13" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12%2021s-7.4-4.5-9.4-9.1C1.1%208.3%203.3%204.6%206.9%204.6c2.1%200%203.6%201.2%204.4%202.6.8-1.4%202.3-2.6%204.4-2.6%203.6%200%205.8%203.7%204.3%207.3C19.4%2016.5%2012%2021%2012%2021z' fill='%23ee4a5e'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="map" aria-label="Map of Sunnyside, Queens"></div>
    <div id="ui"></div>
    <div id="loading" class="loading" role="status">
      <div class="panel loading-panel">
        <div class="loading-title">Sunnyside</div>
        <div class="loading-line" id="loading-line">Loading the neighborhood…</div>
        <button type="button" class="loading-retry" id="loading-retry" hidden>Reload the page</button>
      </div>
    </div>
    <script>
      // If the map has not appeared after 20 seconds, say so instead of spinning forever: on phones
      // this is usually a cached copy of the page pointing at a script that no longer exists.
      setTimeout(function () {
        var panel = document.getElementById('loading');
        if (!panel || panel.classList.contains('done')) return;
        document.getElementById('loading-line').textContent = window.__mapStarted
          ? 'Still loading. Your connection may be very slow.'
          : 'This page could not start. Your browser may be holding an old copy of it.';
        var retry = document.getElementById('loading-retry');
        retry.hidden = false;
        retry.onclick = function () {
          location.replace(location.pathname + '?r=' + Date.now());
        };
      }, 20000);
    </script>
    <noscript>This map of Sunnyside needs JavaScript and WebGL.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
